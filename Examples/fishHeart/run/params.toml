# ============================================================
# FishHeart - PINN4AcousticTag configuration
# ============================================================

# --- I/O paths (relative to this file) ----------------------
output_folder             = ["results"]
phoneFile                 = ["../config/FishHeart_receiver_locs_w_beacons_update_1.csv"]
tagFile                   = ["../config/drifting_tags.csv"]
dataFolder                = ["../data"]
testFile                  = ["../config/Fishheart_EA_test_description.csv"]
GPSFile                   = ["../config/EA_test_notes_and_GPS.csv"]
LFfile                    = [""]

# --- Tag selection ------------------------------------------
TagID     = [3]
badPhones = [[]]

# --- Timing (local time, UTC offset = timeZone) -------------
timeZone   = [-4]
time_start = ["2024-3-21 00:00:00"]
time_end   = ["2024-4-2 00:00:00"]

# --- Acoustic / geometry ------------------------------------
temperature_ref           = [10]
tol_signal                = [0.3]
tol_signal_beacon_preSync = [10]
dis_detect                = [300]
region_lb                 = [[-300, -300, -30]]
region_ub                 = [[300, 300, 30]]
dam                       = ["fishHeart"]
ignoreZ                   = ["False"]
ignorePhoneNum            = [0]
err_GPS                   = [0]
origin_idx                = [1]
theta                     = [0]

# --- Track splitting ----------------------------------------
split_by_TestFile = ["False"]
split_by_tol      = ["False"]
tol_split         = [300]

# --- NN architecture ----------------------------------------
first_layer_nodes  = [200]
hidden_layer_nodes = [128]
hidden_layers      = [3]
last_layer_nodes   = [3]

# --- Training -----------------------------------------------
nIterAdam      = [10000]
nIterBFGS      = [50]
lr             = [0.001]
weight_decay   = [1e-6]
nIterAdam_sync = [5000]

# --- Method -------------------------------------------------
trackMethod = ["NN"]  # "AML" = fast pointwise solver; "NN" = deep network based batchwise solver
aml_n_jobs  = [-1]      # -1 = all CPU cores

# --- UQ -----------------------------------------------------
nSamples    = [1]  # "nSamples=1" = NN solver; "nSamples>1" = NN+ solver
sampleMethod= ["fixed distance"]
uq_std      = [1.0]  # perturbation size for fixed-distance UQ sampling
