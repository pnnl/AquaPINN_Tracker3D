# ============================================================
# Profish - PINN4AcousticTag configuration
# ============================================================

# --- I/O paths (relative to this file) ----------------------
output_folder             = ["results"]
phoneFile                 = ["../config/sequim_testing_node_locs_w_beacons.csv"]
tagFile                   = ["../config/DriftingTags.csv"]
dataFolder                = [""]
testFile                  = ["../config/EA_test_description.csv"]
GPSFile                   = ["../config/drifting_GPS_day1_local_system.csv"]

# --- Tag selection ------------------------------------------
# Paper Table 1 (Salish Sea sea trial) analyses five tags.  After the tag list
# was trimmed to that subset, TagID indexes config/DriftingTags.csv as:
#   0 = G7270F55D (SS400,  PRI 3)   3 = G72679FC4 (SSREF2, PRI 3)
#   1 = G726D7656 (SS400,  PRI 3)   4 = G720EA94F (MSF,    PRI 1)
#   2 = G726777EF (SSREF1, PRI 2)
# Set TagID = [-1] to track all five in one run (needed to reproduce paper
# Fig. 6a / Table 1, which report all five tags) -- budget ~10 min per tag.
TagID     = [2]
badPhones = [[]]

# --- Timing (local time, UTC offset = timeZone) -------------
timeZone   = [0]
time_start = ["2024-2-21 11:30:00"]
time_end   = ["2024-2-21 13:30:00"]

# --- Acoustic / geometry ------------------------------------
temperature_ref           = [8]
tol_signal                = [0.3]
tol_signal_beacon_preSync = [5]
dis_detect                = [300]
region_lb                 = [[-200, -200, -20]]
region_ub                 = [[200, 200, 20]]
dam                       = ["Sequim"]
# The Sequim array is effectively coplanar (receiver z spans only 5.6 m over a
# ~250 m footprint), so the paper evaluates horizontal localization only
# (p. 21) and the YAPS reference solver is 2-D (p. 14).  Solving in 3-D here
# starves the solver: AML drops to 17 fixes / 51.5 % efficiency versus 201
# fixes / 100 % in 2-D on the same data.
ignoreZ                   = ["True"]
ignorePhoneNum            = [0]
err_GPS                   = [0]
origin_idx                = [1]
theta                     = [0]

# --- Track splitting ----------------------------------------
split_by_TestFile = ["False"]
split_by_tol      = ["False"]
tol_split         = [300]

# --- NN architecture ----------------------------------------
first_layer_nodes  = [200]
hidden_layer_nodes = [128]
hidden_layers      = [3]
last_layer_nodes   = [3]

# --- Training -----------------------------------------------
nIterAdam      = [10000]
nIterBFGS      = [50]
lr             = [0.001]
weight_decay   = [1e-6]
nIterAdam_sync = [5000]

# --- Method -------------------------------------------------
trackMethod = ["NN"]  # "AML" = fast pointwise solver; "NN" = deep network based batchwise solver
aml_n_jobs  = [-1]     # -1 = all CPU cores

# --- UQ -----------------------------------------------------
nSamples    = [1] # "nSamples=1" = NN solver; "nSamples>1"= NN+ solver
sampleMethod= ["fixed distance"]
uq_std = [1.0]  # perturbation size for fixed-distance UQ sampling
